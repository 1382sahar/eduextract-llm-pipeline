name: EduExtract Automated Pipeline

on:
workflow_dispatch:
inputs:
target_topic:
description: 'Topic, exact video title, or YouTube URL (leave empty to read D1 queue)'
required: false
default: ''
top_k_videos:
description: 'Number of videos to ingest (1-10)'
required: false
default: ''
schedule:
# Runs daily at 08:30 UTC (12:00 PM IRST)
- cron: '30 8 * * *'

jobs:
run-pipeline:
runs-on: ubuntu-latest

steps:
  # 1. دریافت کدهای مخزن
  - name: Checkout Repository
    uses: actions/checkout@v4

  # 2. راه‌اندازی پایتون ۳.۱۱ و کش کردن وابستگی‌ها
  - name: Set up Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # 3. کش کردن مدل نقطه‌گذاری و واژه‌نامه خودآموز ASR
  - name: Cache HuggingFace Models & ASR Glossary
    uses: actions/cache@v4
    with:
      path: |
        ~/.cache/huggingface
        artifacts/asr_glossary_cache.json
      key: ${{ runner.os }}-eduextract-models-v2
      restore-keys: |
        ${{ runner.os }}-eduextract-models-

  # 4. لایه ۱: جستجوی موضوع / لینک مستقیم ویدیو و استخراج زیرنویس
  - name: Run Layer 1 - Discovery & Transcript Ingestion (D1)
    continue-on-error: true
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
      TARGET_TOPIC: ${{ github.event.inputs.target_topic || '' }}
      TOP_K_VIDEOS: ${{ github.event.inputs.top_k_videos || '' }}
    run: |
      echo ">>> Active TARGET_TOPIC: '$TARGET_TOPIC' \vert{} TOP_K_VIDEOS: '$TOP_K_VIDEOS'"
      python src/main_ingestion.py

  # 5. لایه ۲: پاک‌سازی نویز، تصحیح ASR، نقطه‌گذاری و چانک‌بندی معنایی
  - name: Run Layer 2 - Cleaning, Punctuation & Semantic Chunking (D1)
    continue-on-error: true
    env:
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    run: python src/main_processing.py

  # 6. لایه ۳: تولید جزوه، فلش‌کارت، خروجی PDF/Anki و ارزیابی کیفیت
  - name: Run Layer 3 - Flashcards & Study Guide PDF Synthesis (D1)
    continue-on-error: true
    env:
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python src/main_synthesis.py

  # 7. لایه ۴: ساخت و ذخیره بردارهای ۷۶۸ بُعدی در D1 و Qdrant
  - name: Run Layer 4 - RAG Vector Indexing (D1 + Qdrant)
    continue-on-error: true
    env:
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python src/main_rag_indexer.py

  # 8. آپلود فایل‌های PDF، فلش‌کارت‌ها و دیتابیس محلی Qdrant به عنوان Artifact
  - name: Upload Generated PDFs, Flashcards & Vector DB
    uses: actions/upload-artifact@v4
    if: always()
    with:
      name: eduextract-study-materials
      path: artifacts/
      retention-days: 30
