"""
EduExtract Workflow Generator & Validator (fix_workflow.py)

Automatically writes a clean, 100% valid `.github/workflows/pipeline.yaml` file
with exact 2-space YAML indentation and Unix (LF) line endings so copy-paste
formatting issues can never break GitHub Actions.
"""

import sys
from pathlib import Path

# Exact, indentation-verified GitHub Actions workflow definition
WORKFLOW_YAML = """\
name: EduExtract Automated Pipeline

on:
  workflow_dispatch:
    inputs:
      target_topic:
        description: 'Topic, exact video title, or YouTube URL (leave empty to read D1 queue)'
        required: false
        default: ''
        type: string
      top_k_videos:
        description: 'Number of videos to ingest (1-10)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '30 8 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache HuggingFace Models and ASR Glossary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            artifacts/asr_glossary_cache.json
          key: ${{ runner.os }}-eduextract-models-v2
          restore-keys: |
            ${{ runner.os }}-eduextract-models-

      - name: Run Layer 1 - Discovery and Transcript Ingestion (D1)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
          TARGET_TOPIC: ${{ inputs.target_topic }}
          TOP_K_VIDEOS: ${{ inputs.top_k_videos }}
        run: |
          echo "Active TARGET_TOPIC=$TARGET_TOPIC TOP_K_VIDEOS=$TOP_K_VIDEOS"
          python src/main_ingestion.py

      - name: Run Layer 2 - Cleaning, Punctuation and Semantic Chunking (D1)
        continue-on-error: true
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main_processing.py

      - name: Run Layer 3 - Flashcards and Study Guide PDF Synthesis (D1)
        continue-on-error: true
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main_synthesis.py

      - name: Run Layer 4 - RAG Vector Indexing (D1 and Qdrant)
        continue-on-error: true
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          CLOUDFLARE_WORKER_URL: https://eduextract-chat.ssa210819.workers.dev
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main_rag_indexer.py

      - name: Upload Generated PDFs, Flashcards and Vector DB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eduextract-study-materials
          path: artifacts/
          retention-days: 30
"""


def validate_yaml_structure(content: str) -> None:
    """
    Validates basic structural indentation and, if PyYAML is installed,
    parses the YAML document to guarantee zero syntax errors.
    """
    lines = content.splitlines()
    if len(lines) < 5 or not lines[0].startswith("name: "):
        raise ValueError("Workflow must start with a valid 'name:' header on line 1.")
    if lines[2] != "on:" or not lines[3].startswith("  workflow_dispatch:"):
        raise ValueError("Invalid indentation detected near 'on:' / 'workflow_dispatch:'.")

    try:
        import yaml  # type: ignore

        parsed = yaml.safe_load(content)
        # Note: YAML 1.1 loads bare `on` as boolean True
        triggers = parsed.get("on") or parsed.get(True) or {}
        if "workflow_dispatch" not in triggers:
            raise ValueError("Parsed YAML is missing 'workflow_dispatch' trigger.")
        print("[OK] PyYAML syntax & trigger validation passed.")
    except ImportError:
        print("[OK] Structural indentation validation passed (PyYAML not installed).")


def write_workflow_file() -> Path:
    """Writes `.github/workflows/pipeline.yaml` using UTF-8 encoding and LF newlines."""
    target = Path(".github") / "workflows" / "pipeline.yaml"
    target.parent.mkdir(parents=True, exist_ok=True)
    validate_yaml_structure(WORKFLOW_YAML)
    target.write_text(WORKFLOW_YAML, encoding="utf-8", newline="\n")
    return target


def main() -> int:
    try:
        written_path = write_workflow_file()
        print(f"[SUCCESS] Clean workflow written to: {written_path.resolve()}")
        print("Next step: run these commands to push to GitHub:")
        print("  git add .github/workflows/pipeline.yaml")
        print('  git commit -m "fix: valid workflow_dispatch yaml syntax"')
        print("  git push origin main")
        return 0
    except Exception as exc:
        print(f"[ERROR] Failed to generate workflow file: {exc}", file=sys.stderr)
        return 1


if __name__ == "__main__":
    raise SystemExit(main())
